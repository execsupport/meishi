<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#F6F7F9" />
    <meta name="color-scheme" content="light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Meishi" />
    <title>Meishi</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <style>
      /* Critical first-paint styles so the memo box and skeleton look right before the bundle. */
      html,body{margin:0;background:#f6f7f9;color:#2f3439;font-family:system-ui,-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;letter-spacing:0}
      .shell{max-width:752px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 10px) 16px 120px}
      .narrow{max-width:720px;margin-left:auto;margin-right:auto}
      .hdr{display:flex;align-items:center;justify-content:space-between;height:48px;margin-bottom:10px}
      .composer{display:flex;align-items:flex-end;gap:6px;padding:7px 7px 7px 18px;border-radius:20px;background:rgba(255,255,255,.82);box-shadow:0 10px 28px -14px rgba(47,52,57,.22)}
      .composer textarea{flex:1;min-width:0;min-height:44px;padding:10px 0;border:0;outline:0;resize:none;background:transparent;font:inherit;font-size:17px;line-height:1.45;color:inherit}
      .sk{display:block;height:12px;border-radius:999px;background:rgba(47,52,57,.07)}
    </style>
  </head>
  <body>
    <div class="bg" aria-hidden="true"><i></i><i></i><i></i></div>
    <div class="shell">
      <header class="hdr">
        <div class="brand">
          <svg class="logo" viewBox="0 0 32 32" width="28" height="28" aria-hidden="true">
            <defs>
              <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#E6ECF4" />
                <stop offset="1" stop-color="#6B8BB5" />
              </linearGradient>
            </defs>
            <rect x="2" y="6" width="28" height="20" rx="6" fill="url(#lg)" />
            <circle cx="10.5" cy="14.5" r="3" fill="#fff" />
            <rect x="16" y="12" width="9" height="2.6" rx="1.3" fill="#fff" />
            <rect x="16" y="17" width="6" height="2.6" rx="1.3" fill="#fff" opacity=".75" />
          </svg>
          <span>Meishi</span>
        </div>
        <div id="hdr-slot" class="hdr-slot"><span class="sk sk-avatar"></span></div>
      </header>

      <form id="composer" class="composer glass narrow" action="/memo" method="post" autocomplete="off">
        <input type="hidden" name="id" id="memo-id" />
        <textarea id="memo" name="memo" rows="1" placeholder="メモ" aria-label="メモ" autofocus enterkeyhint="send" maxlength="4000"></textarea>
        <div class="composer-actions">
          <label class="icon-btn" id="scan-btn" for="scan-input" aria-label="名刺を撮影" title="名刺を撮影">
            <svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" d="M4 8.5A2.5 2.5 0 0 1 6.5 6h1.8l1.3-2h4.8l1.3 2h1.8A2.5 2.5 0 0 1 20 8.5v8a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 16.5z"/><circle cx="12" cy="12.4" r="3.4" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
          </label>
          <input type="file" id="scan-input" class="vh" accept="image/*" capture="environment" multiple tabindex="-1" />
          <button type="submit" id="send-btn" class="send-btn" aria-label="追加">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M12 19V5m0 0-6 6m6-6 6 6"/></svg>
          </button>
        </div>
      </form>

      <main id="app" aria-busy="true">
        <div class="skeleton" data-skeleton>
          <div class="sk-bar narrow"><span class="sk sk-search"></span><span class="sk sk-round"></span><span class="sk sk-round"></span></div>
          <div class="sk-tabs glass narrow"><span class="sk"></span><span class="sk"></span><span class="sk"></span><span class="sk"></span></div>
          <div class="sk-grid">
            <div class="sk-card glass"><span class="sk sk-thumb"></span><span class="sk-lines"><span class="sk" style="width:58%"></span><span class="sk" style="width:82%"></span></span></div>
            <div class="sk-card glass"><span class="sk sk-thumb"></span><span class="sk-lines"><span class="sk" style="width:44%"></span><span class="sk" style="width:70%"></span></span></div>
            <div class="sk-card glass"><span class="sk sk-thumb"></span><span class="sk-lines"><span class="sk" style="width:66%"></span><span class="sk" style="width:52%"></span></span></div>
            <div class="sk-card glass"><span class="sk sk-thumb"></span><span class="sk-lines"><span class="sk" style="width:50%"></span><span class="sk" style="width:76%"></span></span></div>
            <div class="sk-card glass"><span class="sk sk-thumb"></span><span class="sk-lines"><span class="sk" style="width:62%"></span><span class="sk" style="width:48%"></span></span></div>
            <div class="sk-card glass"><span class="sk sk-thumb"></span><span class="sk-lines"><span class="sk" style="width:40%"></span><span class="sk" style="width:68%"></span></span></div>
          </div>
          <p id="slow" class="slow" hidden><a href="/">再読み込み</a></p>
        </div>
      </main>
    </div>
    <script src="/boot.js"></script>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
